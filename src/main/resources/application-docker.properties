spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/talent360?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:talent_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:talent_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.upload.dir=/app/uploads/cvs
