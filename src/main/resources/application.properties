spring.application.name=talent360
spring.profiles.active=dev
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

spring.ai.openai.api-key=${OPENAI_API_KEY:mock-openai-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration-ms=1800000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.cookie.name=${JWT_COOKIE_NAME:refreshToken}
app.jwt.cookie.path=${JWT_COOKIE_PATH:/api/auth}
app.jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}

app.upload.dir=${UPLOAD_DIR:./uploads/cvs}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
